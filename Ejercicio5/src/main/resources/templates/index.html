<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CineBuscador - Autenticación</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f23; color: #e0e0e0; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding-top: 40px; }
        .container { background: #1a1a3e; padding: 35px 40px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); width: 520px; max-width: 95vw; }
        h1 { text-align: center; color: #e94560; margin-bottom: 25px; font-size: 1.7em; }
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: #16213e; border: none; color: #aaa; cursor: pointer; border-radius: 6px; font-size: 0.95em; transition: background 0.2s; }
        .tab.active { background: #e94560; color: white; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        label { display: block; margin-bottom: 5px; color: #b0b0c0; font-size: 0.85em; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="text"], input[type="password"] { width: 100%; padding: 11px 12px; margin-bottom: 12px; border: 1px solid #2a2a5a; border-radius: 6px; background: #0f0f23; color: #e0e0e0; font-size: 0.95em; }
        input:focus { outline: none; border-color: #e94560; }
        button[type="submit"] { width: 100%; padding: 11px; background: #e94560; color: white; border: none; border-radius: 6px; font-size: 0.95em; cursor: pointer; margin-bottom: 8px; font-weight: bold; transition: background 0.2s; }
        button[type="submit"]:hover { background: #c73e54; }
        .msg { padding: 11px; border-radius: 6px; margin-bottom: 12px; font-size: 0.88em; }
        .success { background: #1b5e20; color: #a5d6a7; border-left: 3px solid #4caf50; }
        .error { background: #b71c1c; color: #ef9a9a; border-left: 3px solid #f44336; }
        .info-box { background: #16213e; border-left: 3px solid #e94560; padding: 12px; margin: 10px 0; border-radius: 0 6px 6px 0; font-size: 0.83em; color: #b0b0c0; line-height: 1.5; }
        .code { background: #0a0a1a; padding: 8px 10px; border-radius: 4px; font-family: 'Consolas', monospace; word-break: break-all; color: #76ff03; margin-top: 6px; font-size: 0.82em; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.8em; }
        th, td { padding: 7px 8px; text-align: left; border-bottom: 1px solid #2a2a5a; }
        th { color: #e94560; font-weight: bold; }
        td { word-break: break-all; font-family: 'Consolas', monospace; color: #b0c4de; max-width: 250px; overflow: hidden; text-overflow: ellipsis; }
        .admin-link { display: inline-block; margin-top: 12px; padding: 8px 16px; background: #16213e; color: #76ff03; border-radius: 6px; text-decoration: none; font-size: 0.9em; border: 1px solid #76ff03; transition: all 0.2s; }
        .admin-link:hover { background: #76ff03; color: #0f0f23; }
    </style>
</head>
<body>
<div class="container">
    <h1>&#128274; CineBuscador - Login</h1>

    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="showTab('login')">Iniciar Sesi&#243;n</button>
        <button class="tab" onclick="showTab('register')">Registrarse</button>
    </div>

    <!-- Login -->
    <div id="login" class="form-section active">
        <form th:action="@{/login}" method="post">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="nombre de usuario" required>
            <label>Contrase&#241;a</label>
            <input type="password" name="password" placeholder="tu contrase&#241;a" required>
            <button type="submit">Entrar</button>
        </form>
    </div>

    <!-- Register -->
    <div id="register" class="form-section">
        <form th:action="@{/register}" method="post">
            <label>Usuario</label>
            <input type="text" name="username" placeholder="elige un usuario" required>
            <label>Contrase&#241;a</label>
            <input type="password" name="password" placeholder="elige una contrase&#241;a" required>
            <label>Confirmar Contrase&#241;a</label>
            <input type="password" name="confirmPwd" placeholder="repite la contrase&#241;a" required>
            <button type="submit">Registrarse</button>
        </form>
    </div>

    <!-- Mensajes -->
    <div th:if="${loginSuccess}" class="msg success">&#10004; Bienvenido, <strong th:text="${welcomeUser}"></strong>!</div>
    <div th:if="${loginError}" class="msg error" th:text="${loginError}"></div>
    <div th:if="${registerSuccess}" class="msg success">&#10004; Usuario "<span th:text="${registeredUsername}"></span>" creado.</div>
    <div th:if="${registerError}" class="msg error" th:text="${registerError}"></div>

    <!-- Post-login info -->
    <div th:if="${loginSuccess}">
        <div class="info-box">
            <strong>&#128203; Datos de la cuenta (ejercicio):</strong>
            <br><br>
            &#9656; Password cifrada:
            <div class="code" th:text="${encryptedPassword}"></div>
            <br>
        </div>
    </div>
</div>

<script>
function showTab(tab) {
    document.getElementById('login').classList.remove('active');
    document.getElementById('register').classList.remove('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    event.target.classList.add('active');
}
</script>
</body>
</html>
