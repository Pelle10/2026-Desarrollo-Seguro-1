<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Película - CineBuscador</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f1923; color: #e0e0e0; min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a2a3a 0%, #2d4a5a 100%);
            padding: 30px 40px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .header h1 { font-size: 2rem; color: #ffd700; margin-bottom: 8px; }

        .container { max-width: 640px; margin: 30px auto; padding: 0 20px; }

        .form-card {
            background-color: #1a2a3a; border-radius: 10px; padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .form-card h2 { color: #ffd700; margin-bottom: 20px; font-size: 1.3rem; }

        label { display: block; margin-bottom: 6px; color: #8a9aaa; font-size: 0.9rem; }

        input, textarea {
            width: 100%; padding: 12px 16px; margin-bottom: 16px; border: 2px solid #2d4a5a;
            border-radius: 8px; background-color: #0f1923; color: #e0e0e0; font-size: 1rem;
        }

        textarea { min-height: 100px; resize: vertical; font-family: inherit; }

        input:focus, textarea:focus { border-color: #ffd700; outline: none; }

        .btn-row { display: flex; gap: 12px; margin-top: 8px; }

        .btn {
            padding: 12px 24px; font-size: 1rem; font-weight: 600; border: none;
            border-radius: 8px; cursor: pointer;
        }

        .btn-primary { background-color: #ffd700; color: #1a2a3a; }
        .btn-primary:hover { background-color: #ffcc00; }
        .btn-secondary { background-color: #2d4a5a; color: #e0e0e0; }
        .btn-secondary:hover { background-color: #3a5a6a; }

        .prev-descripcion {
            background: #0f1923; border-radius: 8px; padding: 14px 16px;
            margin-bottom: 16px; font-size: 0.9rem; color: #9ab0c0;
        }

        .prev-descripcion strong { color: #ffd700; }
    </style>
</head>
<body>
    <div class="header">
        <h1>&#9786; CineBuscador — Editar Película</h1>
    </div>

    <div class="container">
        {% if pelicula %}
        <div class="form-card">
            <h2>Editar: {{ pelicula['nombre'] }}</h2>

            <form method="post" action="/edit/{{ pelicula['id'] }}">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" value="{{ pelicula['nombre'] }}" required>

                <label for="genero">Género</label>
                <input type="text" id="genero" name="genero" value="{{ pelicula['genero'] }}" required>

                <label for="director">Director/a</label>
                <input type="text" id="director" name="director" value="{{ pelicula['director'] }}" required>

                <label for="descripcion">Descripción</label>
                {% if pelicula['descripcion'] %}
                    <div class="prev-descripcion">
                        <strong>Descripción actual:</strong><br>
                        {{ pelicula['descripcion'] | safe }}
                    </div>
                {% endif %}
                <textarea id="descripcion" name="descripcion">{{ pelicula['descripcion'] }}</textarea>

                <div class="btn-row">
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    <a href="/" class="btn btn-secondary" style="text-decoration:none;text-align:center;">Cancelar</a>
                </div>
            </form>
        </div>

        {% else %}
            <div style="text-align:center;padding:80px 20px;color:#6a8a9a;">
                <p>No se encontró la película.</p>
                <a href="/" style="color:#ffd700;text-decoration:underline;">Volver al buscador</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
